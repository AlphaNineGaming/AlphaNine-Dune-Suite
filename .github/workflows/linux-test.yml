name: Linux test build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: JavaScript and Python syntax
        run: |
          node --check server.js
          node --check lib/remote-access.js
          python3 -m py_compile manager/manager-server.py
          sh -n linux/install.sh
      - name: Security and Linux regression tests
        run: |
          npm run test:remote-access
          npm run test:linux-platform
          npm run test:secret-persistence
          npm run test:setup-paths
          npm run test:setup-database
          npm run test:player-rename
          npm run test:base-cleanup
          npm run test:operations
          npm run test:python-discovery
          npm run test:specialization-progression
      - name: Build Linux package
        run: npm run build:linux
      - name: Test packaged server
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find dist/linux -maxdepth 1 -name 'AlphaNine-Dune-Suite-*-linux-x64.tar.gz' -print -quit)
          test -n "$artifact"
          mkdir package-test
          tar -xzf "$artifact" -C package-test
          package_dir=$(find package-test -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$package_dir/server.js"
          test -d "$package_dir/node_modules/selfsigned"
          data_dir=$(mktemp -d)
          PORT=18920 ALPHANINE_HTTPS_PORT=18921 ALPHANINE_DATA_DIR="$data_dir" ALPHANINE_SKIP_MANAGER=1 node "$package_dir/server.js" >packaged-linux.log 2>&1 &
          suite_pid=$!
          trap 'kill "$suite_pid" 2>/dev/null || true; rm -rf "$data_dir"' EXIT
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:18920/api/remote-access/status >status.json && break
            sleep 0.25
          done
          grep -q '"ok":true' status.json
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18921/)" = "302"
          ALPHANINE_DATA_DIR="$data_dir" ALPHANINE_ADMIN_PASSWORD='ubuntu-package-test-42' node "$package_dir/scripts/set-remote-password.js" --username admin
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18921/api/status)" = "401"
      - name: Upload Linux test artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaNine-Dune-Suite-${{ github.sha }}-linux-x64
          path: |
            dist/linux/AlphaNine-Dune-Suite-*-linux-x64.tar.gz
            dist/linux/AlphaNine-Dune-Suite-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
